bot:
  abi_migration_branches:
  # Kept because mg5amcnlo-pythia8-interface builds a variant against
  # `pythia8 8.311.*`; this is an exact-version pin, not an ABI boundary.
  - '8.311'
  automerge: true
build_platform:
  linux_ppc64le: linux_64
conda_build_tool: rattler-build
conda_forge_output_validation: true
conda_install_tool: pixi
github:
  branch_name: main
  tooling_branch_name: main
provider:
  linux_aarch64: default
  osx_arm64: default
test: native_and_emulated
